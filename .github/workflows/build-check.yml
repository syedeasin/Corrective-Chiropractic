name: build-check
on:
  push:
    branches: [build-check]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build 2>&1 | tee build.log
      - name: Publish dist and log to build-check-dist
        if: always()
        run: |
          mkdir -p /tmp/out && cp -r dist /tmp/out/ 2>/dev/null || true
          cp build.log /tmp/out/ 2>/dev/null || true
          cd /tmp/out
          git init -q -b build-check-dist
          git config user.name "build-check"
          git config user.email "build-check@users.noreply.github.com"
          git add -A && git commit -qm "dist ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" build-check-dist
